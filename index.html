<style>
:root{--bg:#0f1419;--card:#1a222c;--borde:#2a3542;--texto:#e6edf3;--tenue:#8b98a5;--acento:#3fb6ff;--mal:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.caja{width:100%;max-width:360px;background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:22px}
h1{font-size:1.25rem;margin:10px 0 4px;text-align:center}p{color:var(--tenue);font-size:.88rem;text-align:center;margin:0 0 14px}
label{display:block;font-size:.85rem;color:var(--tenue);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--borde);background:#222c38;color:var(--texto);font:inherit;font-size:16px}
.rec{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--tenue);font-size:.88rem}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--acento);color:#04121c;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}#error{color:var(--mal);font-size:.88rem;text-align:center;min-height:1.2em;margin-top:10px}
.logo{display:block;margin:0 auto;width:64px;height:64px}

const K='mi_entrenamiento_llave';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const aB64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function abrir(raw){
  const llave=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const txt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},llave,b64(P.datos)));
  document.open();document.write(txt);document.close();
}
async function derivar(u,c){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+':'+c),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.sal),iterations:P.iter,hash:'SHA-256'},base,256);
}
(async()=>{let g=null;try{g=localStorage.getItem(K)}catch(e){}
  if(g){try{const o=JSON.parse(g);if(o.sal===P.sal){await abrir(b64(o.k));return}}catch(e){}
    try{localStorage.removeItem(K)}catch(e){}}
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const btn=document.getElementById('b'),er=document.getElementById('error');
  btn.disabled=true;btn.textContent='Verificando…';er.textContent='';
  try{const raw=await derivar(document.getElementById('u').value,document.getElementById('c').value);
    if(document.getElementById('r').checked){try{localStorage.setItem(K,JSON.stringify({sal:P.sal,k:aB64(raw)}))}catch(x){}}
    await abrir(raw);
  }catch(x){er.textContent='Usuario o clave incorrectos';btn.disabled=false;btn.textContent='Entrar';}
});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
